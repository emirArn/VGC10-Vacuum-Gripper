# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - /sim/sim_scaled_joint_trajectory_controller
    - /sim/kawasaki_controller
    - /sim  /sim_gripper_controller

  /sim/sim_scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - sim_ur10e_base_to_robot_mount
      - sim_ur10e_shoulder_pan_joint
      - sim_ur10e_shoulder_lift_joint
      - sim_ur10e_elbow_joint
      - sim_ur10e_wrist_1_joint
      - sim_ur10e_wrist_2_joint
      - sim_ur10e_wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true
  /sim/kawasaki_controller:
    type: FollowJointTrajectory
    joints:
      - sim_world_to_agv
      - sim_kawasaki_joint1
      - sim_kawasaki_joint2
      - sim_kawasaki_joint3
      - sim_kawasaki_joint4
      - sim_kawasaki_joint5
      - sim_kawasaki_joint6
    action_ns: follow_joint_trajectory
    default: true
  /sim/sim_gripper_controller:
    type: FollowJointTrajectory
    joints:
      - sim_ur10e_gripper_joint
    action_ns: follow_joint_trajectory
    default: true