controller_manager:
  ros__parameters:
    update_rate: 50  # Hz – matches the robot's practical command rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Allow some goal tolerance because the robot's internal planner
    # may not achieve sub-milliradian accuracy at each waypoint.
    goal_time: 0.0  # 0 = no goal-time check
    stopped_velocity_tolerance: 0.05  # rad/s

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
