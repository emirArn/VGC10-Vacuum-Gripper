# Coverage / allocation parameters for the CAR DOOR inspection job.
#
# Deliberately the same sensor model and candidate density as the chassis run
# (multirobot_viewpoint_planner/config/multirobot_params.yaml) so the two jobs stay
# comparable: only the target geometry changes. Every value that DOES differ is
# called out below with the reason.
#
# Matched with /** so the file applies whatever the launch file names the node.
/**:
  ros__parameters:
    # --- Camera: identical to the chassis job (same SICK on both arms). ---
    camera:
      horizontal_fov_deg: 70.0
      vertical_fov_deg: 60.0
      fov_safety_margin_deg: 3.0
      min_range_m: 0.2
      max_range_m: 1.8
      frame_rate_hz: 5.0
      # MINIMUM STAND-OFF 1.0 m (was 0.6, and 0.3 before that). Candidates are placed at
      # `surface_point + normal * d`, so this list is literally the set of stand-off
      # rings, and it is shared by both arms -- one candidate set is generated and then
      # allocated, so there is no per-robot version of this to keep in sync.
      #
      # Raised after the first REAL run: the octomap came back with the lower part of
      # both doors almost unscanned. Standing further back widens the footprint each
      # shot covers, so a viewpoint aimed at mid-door still catches the bottom edge.
      #
      # The sensor is still inside its good band. Measured on the real captures
      # (20-neighbour plane residual / neighbour spacing per range band):
      #   0.6-0.8 m  0.98 mm / 1.90 mm      1.4-1.8 m  0.98 mm / 4.42 mm
      #   0.8-1.0 m  0.90 mm / 2.62 mm      1.8-2.5 m  1.94 mm / 5.94 mm
      # Noise is flat out to ~1.8 m and only lateral resolution degrades, so every ring
      # below sits in the flat-noise region; 1.6 is the last one that does, which is why
      # the list stops there rather than reaching for max_range_m (1.8).
      #
      # The list STAYS FOUR RINGS rather than just dropping the two below 1.0: each ring
      # is a quarter of the candidate pool, and shrinking the pool lowers the geometric
      # coverage ceiling before the allocator ever gets to choose.
      #
      # NOTE the chassis job keeps 0.3 (multirobot_params.yaml): there the near ring
      # exists so the camera can sit INSIDE the chassis openings to reach interior
      # faces. The doors are open panels with nothing to reach into.
      viewpoint_distances: [1.0, 1.2, 1.4, 1.6]
      tilt_variations_deg: [-15.0, 0.0, 15.0]
      max_incidence_angle_deg: 80.0

    # 98%, lowered from 99.2% after the first real run. This is the stop condition: the
    # greedy loop ends as soon as cumulative coverage crosses it.
    #
    # 99.2% was already out of reach once the Kawasaki was capped at 3 viewpoints (see
    # max_viewpoints_kawasaki below): the last planned tour finished at 96.84%, so the
    # threshold never fired and the tail cutter (min_new_points) ended the run instead.
    # 98% is still above what that tour reached, so whether this number or the tail
    # cutter stops the run depends on how much the wider stand-off rings above buy back.
    # Check the planner's "Allocation done: coverage ..." line after the next re-plan.
    #
    # Lower it further to end the tour sooner, raise it to keep adding viewpoints; the
    # geometric ceiling with no arm cap measured 4959/4960 targets (100.0%).
    coverage_threshold: 0.98

    # Candidate density: same knobs as the chassis run. The doors are only
    # 6.82 m^2 against the chassis's 31.97 m^2, so at the SAME 5000 targets the
    # sampling is ~5x denser here. That is deliberate: a door defect is small, and
    # the extra targets cost only coverage-matrix time, which embree absorbs.
    num_base_points: 400
    target_sample_points: 5000

    # Tail cutters: LOOSENED for the doors (the chassis job runs 8 / 0.005).
    # The effective floor is max(min_new_points, min_marginal_coverage * targets), and
    # with the chassis values that was max(8, 0.5% of 4960 = 25) = 25 new points per
    # viewpoint. On a 6.8 m^2 target that cut the tour at 5 viewpoints per arm.
    #
    # The fractional cutter is switched OFF and the absolute one dropped to 5, i.e. a
    # viewpoint earns its place if it adds 5 of 4960 targets (0.1%).
    #
    # These are now the BACKSTOP, not the primary stop: with coverage_threshold at 0.992
    # (attainable) the run normally ends on the threshold instead. They still decide the
    # outcome if reachability keeps the tour below 99.2%, which is exactly when a
    # runaway tail of near-worthless viewpoints would otherwise appear.
    # Raise min_new_points to shorten the tour, lower it to lengthen it.
    min_new_points: 5
    min_marginal_coverage: 0.0
    # Still the hard guard against a runaway tail; the run should stop well below it.
    max_viewpoints_per_robot: 30

    # KAWASAKI CAPPED AT 3 VIEWPOINTS -- doors only; the chassis job has no per-arm
    # override and keeps the shared cap above.
    #
    # The arms run in parallel, so the run costs ~max(time_ur, time_kawasaki), NOT the
    # total. They are nowhere near equally fast: on the real cell the UR finished all 8
    # of its stops while the Kawasaki had managed about 1.5 of its 6. So the previous
    # 8/6 split was not a balanced plan at all -- it was a Kawasaki-paced run with the
    # UR standing idle for most of it. Capping the slow arm is what shortens the run;
    # lowering max_viewpoints_per_robot could not express this, since it throttles both.
    #
    # 0 on the UR = no override, so the work the Kawasaki sheds lands on the UR and its
    # count grows past 8. That is the intended trade: more stops on the fast arm.
    max_viewpoints_ur: 0
    max_viewpoints_kawasaki: 3

    # false -> fixed arm priority, UR first (the chassis job keeps true).
    #
    # This is what makes the cap of 3 pay off. With balancing on, the least-loaded arm
    # wins, so the Kawasaki would spend its 3 stops on the earliest, highest-gain
    # candidates -- exactly the ones the UR could have taken anyway -- and then be
    # capped out when a face only IT can reach comes up, which drops that face.
    # With UR-first priority the Kawasaki receives only candidates the UR cannot reach,
    # so its 3 stops go where they are irreplaceable and the coverage cost is minimal.
    balance_load: false

    # Visiting order. The two doors are laid out along Y (windowlessdoor
    # y 0.088..1.319, windowdoor y 1.301..2.478), so the max_y / min_y anchors still
    # send the two arms to opposite ends of the pair instead of crowding one door.
    order_by_proximity: true
    ur_order_anchor: "max_y"
    kawasaki_order_anchor: "min_y"

    # Travel optimisation: same settings that were validated on the chassis job.
    unwind_joint_goals: true
    wrap_limit_margin: 0.05
    wrap_min_gain: 0.35
    rechain_ik: true
    rechain_ik_attempts: 4
    rechain_rail_probe: 0.25
    rechain_rail_weight: 2.0
    rechain_yaw_probe: true
    rechain_yaw_joint: "joint1"
    rechain_rail_joint: "world_to_agv"

    ik_avoid_collisions: true

    # --- UR10e ---
    ur_group_name: "real_ur10e"
    ur_base_frame: "world"
    ur_tool_frame: "ur10e_depth_optical_frame"

    # Keep-out box for the UR only, unchanged from the chassis job: it rejects camera
    # poses BEHIND the UR's own linear rail (rail at world X=-0.158; the -0.20 upper
    # bound leaves ~4 cm), which the mesh-only occlusion model cannot see.
    #
    # It does NOT need a door-specific tweak. The doors stand at x -1.21..-0.79,
    # between the two arms: the +X faces look at the UR and the -X faces look at the
    # Kawasaki (AGV rail at x ~ -2.2). The allocator hands each face to whichever arm
    # can actually reach it, so the two sides split across the two arms by geometry
    # rather than by a hand-written rule.
    ur_workspace_filter_enabled: true
    ur_workspace_bounds_min: [-100.0, -100.0, 0.20]
    ur_workspace_bounds_max: [-0.20, 100.0, 100.0]

    # --- Kawasaki: IK is solved for the group tip (link6) with the fixed
    #     camera->tip transform applied. Same as the chassis job. ---
    kawasaki_group_name: "real_kawasaki"
    kawasaki_base_frame: "world"
    kawasaki_camera_frame: "camera_rgb_optic_frame"
    kawasaki_group_tip: "link6"
    kawasaki_ik_via_tip: true
    kawasaki_view_axis_correction_rpy: [-1.5707963, -1.5707963, 0.0]
