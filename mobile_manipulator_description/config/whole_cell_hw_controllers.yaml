# ==============================================================================
# WHOLE CELL HW CONTROLLERS
# ==============================================================================
# Birleşik donanım (fake + gerçek) controller yapılandırması.
# Tek bir controller_manager altında tüm bileşenlerin controller'ları:
#   1. UR10e + Lineer Eksen (ur10e_ prefix)
#   2. Kawasaki RS005L kol (joint1-6, tf_prefix yok)
#   3. AGV (world_to_agv + tekerlekler)
#
# Bu dosya whole_cell_hw.urdf.xacro ile birlikte kullanılır.
# ==============================================================================

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    # --- Ortak ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # --- UR10e ---
    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # --- Kawasaki RS005L ---
    # kawasaki_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    # # --- AGV ---
    # ota_base_controller:
    #   type: diff_drive_controller/DiffDriveController


# ==============================================================================
# UR10e Controller Parametreleri
# ==============================================================================

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: ur10e_tool0
    topic_name: ft_data

# UR10e kolu (lineer eksen hariç, 6 eksen)
joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur10e_shoulder_pan_joint:  { trajectory: 0.2, goal: 0.1 }
      ur10e_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur10e_elbow_joint:         { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_1_joint:       { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_2_joint:       { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_3_joint:       { trajectory: 0.2, goal: 0.1 }

# UR10e kolu + lineer eksen (7 eksen, MoveIt için)
scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur10e_base_to_robot_mount
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur10e_base_to_robot_mount:  { trajectory: 0.5, goal: 0.3 }
      ur10e_shoulder_pan_joint:   { trajectory: 0.2, goal: 0.1 }
      ur10e_shoulder_lift_joint:  { trajectory: 0.2, goal: 0.1 }
      ur10e_elbow_joint:          { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_1_joint:        { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_2_joint:        { trajectory: 0.2, goal: 0.1 }
      ur10e_wrist_3_joint:        { trajectory: 0.2, goal: 0.1 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint

