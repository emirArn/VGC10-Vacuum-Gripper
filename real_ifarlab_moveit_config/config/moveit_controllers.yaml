# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - /kawasaki/kawasaki_controller

  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - ur10e_base_to_robot_mount
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true
  /kawasaki/kawasaki_controller:
    type: FollowJointTrajectory
    joints:
      - world_to_agv
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    action_ns: follow_joint_trajectory
    default: true
    # move_group's own execution-duration monitor, for THIS controller only (the UR
    # keeps the global 1.2 x duration + 0.5 s). With the defaults it cancelled a
    # Free Move after 1.2 x planned + 0.5 s ("expected upper bound ... 22.3 s",
    # TIMED_OUT, 2026-09-11) while the controller was still legitimately waiting
    # for the slow AGV. The margin matches goal_time in
    # whole_cell_kawasaki_controllers.yaml and EXECUTE_TIMEOUT in
    # user_interface/free_move.py (240 s) -- raise all three together, so the
    # CONTROLLER decides when a move has failed, not move_group.
    allowed_execution_duration_scaling: 1.2
    allowed_goal_duration_margin: 240.0